name: Sync release notes
on:
  push:
    branches: [main]
    paths:
      - docs/RELEASE.md
      - .github/workflows/release-notes.yml
permissions:
  contents: write
concurrency:
  group: release-notes
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"v${version}\") | .tag_name")
          if [ -n "$tag" ]; then
            gh release edit "$tag" --notes-file docs/RELEASE.md
          fi
